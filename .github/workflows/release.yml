name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer and publish release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches app + installer versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $app = (Select-String -Path ssakkimchi/version.py -Pattern 'VERSION = "([^"]+)"').Matches.Groups[1].Value
          $iss = (Select-String -Path tools/installer.iss -Pattern '#define MyAppVersion "([^"]+)"').Matches.Groups[1].Value
          if ($tag -ne $app -or $tag -ne $iss) { throw "version mismatch: tag=$tag version.py=$app installer.iss=$iss" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package (ffmpeg + PyInstaller + zip + installer)
        run: python tools/package.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          # 고정 파일명 자산: 공홈이 releases/latest/download/<고정명> 으로 항상 최신을 가리키게 함
          Copy-Item "dist/Setup_SsakKimchiCapture_$ver.exe" "dist/Setup_SsakKimchiCapture.exe"
          Copy-Item "dist/싹싹김치 캡처.zip" "dist/SsakKimchiCapture_portable.zip"
          gh release create "${{ github.ref_name }}" `
            --repo ${{ github.repository }} `
            --title "싹싹김치 캡처 v$ver" `
            --generate-notes `
            "dist/Setup_SsakKimchiCapture_$ver.exe" `
            "dist/Setup_SsakKimchiCapture.exe" `
            "dist/SsakKimchiCapture_portable.zip"

      - name: Bump version.json for auto-update
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $j = Get-Content version.json -Raw | ConvertFrom-Json
          $j.latest_version = $ver
          $j | ConvertTo-Json -Depth 5 | Set-Content version.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: bump version.json to $ver [skip ci]"
            git push origin HEAD:main
          } else {
            echo "version.json already at $ver — nothing to commit"
          }
